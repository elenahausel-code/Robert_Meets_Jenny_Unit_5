<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robert's Decision Matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bar:#2f80d1;          /* title bar, same blue as Drawing A */
    --bar-text:#ffffff;
    --btn:#1d5e85;          /* dark teal button */
    --btn-hover:#164a69;
    --link:#1d5e85;
    --border:#d3dbe3;
    --veil:rgba(232,238,244,.72);
    --text:#2d3b45;
    --bg:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Lato","Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:1400px;margin:0 auto;padding:8px}
  .card{border:1px solid var(--border);overflow:hidden}
  .bar{background:var(--bar);color:var(--bar-text);text-align:center;
    font-size:20px;padding:14px 16px;transition:background .3s,color .3s}
  .card.revealed .bar{background:#d9e8f6;color:var(--text)}
  .stage{position:relative;background:#eef2f6;overflow:hidden}
  .stage img{display:block;width:100%;height:auto;
    filter:blur(9px) saturate(.6);transform:scale(1.02);
    transition:filter .45s ease, transform .45s ease}
  .card.revealed .stage img{filter:none;transform:none}
  .veil{position:absolute;inset:0;background:var(--veil);
    display:flex;align-items:center;justify-content:center;
    transition:opacity .35s ease}
  .card.revealed .veil{opacity:0;pointer-events:none}
  .btn{font:700 20px/1 "Lato",Arial,sans-serif;color:#fff;background:var(--btn);
    border:0;border-radius:4px;padding:18px 34px;cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.18)}
  .btn:hover{background:var(--btn-hover)}
  .btn:focus-visible,.links a:focus-visible,.links button:focus-visible{
    outline:3px solid #f2b705;outline-offset:3px}
  .links{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
    padding:12px 2px 4px;visibility:hidden}
  .card.revealed + .links{visibility:visible}
  .links a,.links button{font:400 18px "Lato",Arial,sans-serif;color:var(--link);
    text-decoration:underline;background:none;border:0;padding:0;cursor:pointer}
  @media (max-width:600px){
    .bar{font-size:17px}
    .btn{font-size:17px;padding:14px 22px}
    .links a,.links button{font-size:16px}
  }
  @media (prefers-reduced-motion:reduce){
    .stage img,.veil,.bar{transition:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <div class="bar">Robert's Decision Matrix</div>
    <div class="stage">
      <img id="matrix" src="robert-decision-matrix.png"
           alt="Robert's decision matrix. The quest: how should Robert attract 1,000 trustworthy, well-intentioned members to his online dating agency within the next six months, given that fraud has made people wary of online dating? Criteria and weights: trust and safety 5, speed 4, convenience of membership 3, convenience of business model 3. Ranking: 1. Alternative 1, full verification with ID check plus live video call, score 57. 2. Alternative 3, offline first with speed-dating evenings in local cafés and bars, score 55. 3. Alternative 4, a serious membership fee, score 52. 4. Alternative 2, invitation only, score 49. Robert's confidence: 100%."
           aria-hidden="true">
      <div class="veil" id="veil">
        <button class="btn" id="reveal" type="button" aria-controls="matrix" aria-expanded="false">
          Reveal the Decision Matrix
        </button>
      </div>
    </div>
  </div>
  <div class="links">
    <a href="robert-decision-matrix.png" target="_blank" rel="noopener">Open full size in a new tab</a>
    <button type="button" id="hide">Hide the Decision Matrix</button>
  </div>
</div>
<script>
  (function(){
    var card=document.getElementById('card'),
        img=document.getElementById('matrix'),
        reveal=document.getElementById('reveal'),
        hide=document.getElementById('hide');
    function set(open){
      card.classList.toggle('revealed',open);
      reveal.setAttribute('aria-expanded',open?'true':'false');
      img.setAttribute('aria-hidden',open?'false':'true');
      (open?hide:reveal).focus({preventScroll:true});
    }
    reveal.addEventListener('click',function(){set(true)});
    hide.addEventListener('click',function(){set(false)});
  })();
</script>
</body>
</html>
